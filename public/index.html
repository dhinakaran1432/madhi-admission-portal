/* ============================================================
   RUNTIME STATE
   ============================================================ */
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentUser = null;
let currentView = 'landing';
let pollTimer = null;
let lastServerUpdatedAt = null;
let deferredPrompt = null;
let pendingAppData = null;

/* ============================================================
   CRYPTO
   ============================================================ */
async function sha256(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function newHash(password) {
  return sha256('madhi$v1$' + password);
}

async function verifyHash(password, stored) {
  if (!stored) return false;
  if (!/^[a-f0-9]{64}$/.test(stored)) return stored === password;
  const candidates = ['madhi$v1$' + password, 'madhi$' + password, 'madhi' + password, password];
  for (const salt of candidates) {
    const h = await sha256(salt);
    if (h === stored) return true;
  }
  return false;
}

/* ============================================================
   API
   ============================================================ */
async function apiGet() {
  const res = await fetch(API_URL, { headers: { 'X-Api-Key': API_KEY } });
  if (!res.ok) throw new Error('GET ' + res.status);
  return res.json();
}

async function apiPut(data) {
  const res = await fetch(API_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
    body: JSON.stringify({ data })
  });
  if (!res.ok) throw new Error('PUT ' + res.status);
  return res.json();
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveLocal() {
  try { localStorage.setItem(K_CACHE, JSON.stringify(state)); } catch (e) { log('save fail', e); }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(K_CACHE);
    if (raw) state = Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
  } catch (e) { log('load fail', e); }
}

async function save() {
  saveLocal();
  try {
    const res = await apiPut(state);
    lastServerUpdatedAt = res.updatedAt;
  } catch (e) { log('server save fail', e); }
}

async function bootPull() {
  try {
    const res = await apiGet();
    if (res && res.data) {
      state = Object.assign({}, DEFAULT_STATE, res.data);
      lastServerUpdatedAt = res.updatedAt;
      saveLocal();
    }
  } catch (e) {
    log('boot pull fail', e);
    loadLocal();
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const fmtDateTime = (d) => d ? new Date(d).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtINR = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.className = 'toast toast--' + type + ' toast--show';
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('toast--show'), 3500);
}

const todayStr = () => new Date().toISOString().slice(0, 10);
const yesterdayStr = () => new Date(Date.now() - 86400000).toISOString().slice(0, 10);

/* ============================================================
   SESSION
   ============================================================ */
function setSession(username) {
  currentUser = state.users.find(u => u.username === username) || null;
  if (currentUser) localStorage.setItem(K_SESSION, JSON.stringify({ username, at: Date.now() }));
}

function clearSession() {
  currentUser = null;
  localStorage.removeItem(K_SESSION);
  stopPolling();
}

function restoreSession() {
  try {
    const raw = localStorage.getItem(K_SESSION);
    if (!raw) return;
    const { username } = JSON.parse(raw);
    currentUser = state.users.find(u => u.username === username) || null;
  } catch (e) { log('restore session fail', e); }
}

/* ============================================================
   OWNER SEED
   ============================================================ */
async function ensureOwner() {
  if (state.users.find(u => u.username === OWNER_USERNAME)) return;
  const hash = await newHash(OWNER_PASSWORD);
  state.users.push({
    id: uid(),
    username: OWNER_USERNAME,
    passwordHash: hash,
    name: 'School Admin',
    role: 'owner',
    phone: '',
    email: '',
    joinedAt: new Date().toISOString(),
    membershipStatus: 'active',
    streak: 0,
    lastLoginDate: ''
  });
  await save();
}

/* ============================================================
   POLLING
   ============================================================ */
function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    try {
      const res = await apiGet();
      if (!res) return;
      if (res.updatedAt === lastServerUpdatedAt) return;
      const focused = document.activeElement;
      if (focused && ['INPUT','TEXTAREA','SELECT'].includes(focused.tagName)) return;
      state = Object.assign({}, DEFAULT_STATE, res.data);
      lastServerUpdatedAt = res.updatedAt;
      saveLocal();
      render();
      log('polled new data');
    } catch (e) { log('poll fail', e); }
  }, POLL_INTERVAL);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

/* ============================================================
   AUTH
   ============================================================ */
async function doLogin(username, password) {
  if (!username || !password) return { ok: false, error: 'Enter username and password' };
  const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase().trim());
  if (!user) return { ok: false, error: 'Account not found' };
  const ok = await verifyHash(password, user.passwordHash);
  if (!ok) return { ok: false, error: 'Incorrect password' };
  if (!/^[a-f0-9]{64}$/.test(user.passwordHash)) {
    user.passwordHash = await newHash(password);
  }
  updateStreak(user.id);
  await save();
  setSession(user.username);
  return { ok: true, user };
}

async function doRegister(form) {
  if (!form.name || !form.username || !form.password) return { ok: false, error: 'Fill all required fields' };
  if (state.users.find(u => u.username.toLowerCase() === form.username.toLowerCase())) return { ok: false, error: 'Username taken' };
  if (form.password.length < 6) return { ok: false, error: 'Password must be 6+ chars' };
  const hash = await newHash(form.password);
  const user = {
    id: uid(),
    username: form.username.trim(),
    passwordHash: hash,
    name: form.name.trim(),
    role: 'parent',
    phone: form.phone || '',
    email: form.email || '',
    joinedAt: new Date().toISOString(),
    membershipStatus: 'active',
    streak: 1,
    lastLoginDate: todayStr()
  };
  state.users.push(user);
  addPoints(user.id, 10);
  state.notifications.push({
    id: uid(), userId: user.id,
    title: 'Welcome to Madhi!', body: 'Your account is ready. Start your admission application.',
    read: false, at: new Date().toISOString()
  });
  await save();
  setSession(user.username);
  return { ok: true, user };
}

function logout() {
  clearSession();
  navigate('landing');
}

/* ============================================================
   GAMIFICATION
   ============================================================ */
function addPoints(userId, amount) {
  state.points[userId] = (state.points[userId] || 0) + amount;
  checkBadges(userId);
}

function unlockBadge(userId, badgeId) {
  const earned = state.badges[userId] || (state.badges[userId] = []);
  if (earned.includes(badgeId)) return;
  earned.push(badgeId);
  addPoints(userId, 50);
  const badge = BADGES.find(b => b.id === badgeId);
  state.notifications.push({
    id: uid(), userId,
    title: 'Badge unlocked! 🎉',
    body: badge ? badge.name : badgeId,
    read: false, at: new Date().toISOString()
  });
}

function checkBadges(userId) {
  const pts = state.points[userId] || 0;
  const user = state.users.find(u => u.id === userId);
  const earned = state.badges[userId] || (state.badges[userId] = []);
  const appForUser = state.applications.filter(a => a.parentId === userId);
  const payForUser = state.payments.filter(p => p.parentId === userId);
  if (user && user.role === 'parent' && user.phone && user.email) unlockBadge(userId, 'profile_pro');
  if (appForUser.length > 0) unlockBadge(userId, 'applicant');
  if (payForUser.some(p => p.status === 'approved')) unlockBadge(userId, 'paid_up');
  if (appForUser.some(a => a.status === 'approved')) unlockBadge(userId, 'approved');
  if (user && user.streak >= 3) unlockBadge(userId, 'streak_3');
  if (user && user.streak >= 7) unlockBadge(userId, 'streak_7');
  if (user && user.streak >= 30) unlockBadge(userId, 'streak_30');
  if (pts >= 100) unlockBadge(userId, 'pts_100');
  if (pts >= 500) unlockBadge(userId, 'pts_500');
  const firstApp = appForUser[0];
  if (user && firstApp) {
    const days = (new Date(firstApp.createdAt) - new Date(user.joinedAt)) / 86400000;
    if (days <= 7) unlockBadge(userId, 'early');
  }
  if (user && user.referredBy) unlockBadge(userId, 'referrer');
}

function updateStreak(userId) {
  const user = state.users.find(u => u.id === userId);
  if (!user) return;
  const today = todayStr();
  if (user.lastLoginDate === today) return;
  if (user.lastLoginDate === yesterdayStr()) user.streak = (user.streak || 0) + 1;
  else user.streak = 1;
  user.lastLoginDate = today;
  addPoints(userId, 10);
}

/* ============================================================
   APPLICATIONS & PAYMENTS
   ============================================================ */
async function submitApplication(data) {
  if (!currentUser) return { ok: false, error: 'Login required' };
  const app = {
    id: uid(),
    parentId: currentUser.id,
    parentName: currentUser.name,
    parentPhone: currentUser.phone,
    studentName: data.studentName,
    dob: data.dob,
    gender: data.gender,
    grade: data.grade,
    previousSchool: data.previousSchool || '',
    address: data.address,
    status: 'pending_payment',
    createdAt: new Date().toISOString(),
    reference: 'MAD-' + Date.now().toString(36).toUpperCase().slice(-6)
  };
  state.applications.push(app);
  addPoints(currentUser.id, 15);
  state.notifications.push({
    id: uid(), userId: currentUser.id,
    title: 'Application created',
    body: 'Reference ' + app.reference + '. Pay the fee to continue.',
    read: false, at: new Date().toISOString()
  });
  await save();
  return { ok: true, app };
}

async function markPaid(applicationId) {
  const app = state.applications.find(a => a.id === applicationId);
  if (!app) return { ok: false };
  if (app.status !== 'pending_payment') return { ok: false, error: 'Invalid status' };
  app.status = 'payment_review';
  state.payments.push({
    id: uid(), applicationId, parentId: app.parentId,
    amount: state.settings.applicationFee, method: 'UPI',
    status: 'pending', at: new Date().toISOString()
  });
  state.notifications.push({
    id: uid(), userId: app.parentId,
    title: 'Payment under review',
    body: 'Your payment for ' + app.studentName + ' is being verified.',
    read: false, at: new Date().toISOString()
  });
  await save();
  return { ok: true };
}

async function approveApp(applicationId) {
  const app = state.applications.find(a => a.id === applicationId);
  if (!app) return { ok: false };
  app.status = 'approved';
  app.approvedAt = new Date().toISOString();
  state.payments.filter(p => p.applicationId === applicationId && p.status === 'pending').forEach(p => p.status = 'approved');
  addPoints(app.parentId, 25);
  state.notifications.push({
    id: uid(), userId: app.parentId,
    title: 'Admission Approved! 🎉',
    body: app.studentName + ' has been admitted to Madhi School.',
    read: false, at: new Date().toISOString()
  });
  await save();
  return { ok: true };
}

async function rejectApp(applicationId, reason) {
  const app = state.applications.find(a => a.id === applicationId);
  if (!app) return { ok: false };
  app.status = 'rejected';
  app.reason = reason || '';
  state.payments.filter(p => p.applicationId === applicationId && p.status === 'pending').forEach(p => p.status = 'refunded');
  state.notifications.push({
    id: uid(), userId: app.parentId,
    title: 'Application update',
    body: 'Application not approved. ' + (reason || ''),
    read: false, at: new Date().toISOString()
  });
  await save();
  return { ok: true };
}

async function placeOrder(itemId) {
  if (!currentUser) return { ok: false };
  const item = STORE_ITEMS.find(i => i.id === itemId);
  if (!item) return { ok: false };
  state.orders.push({
    id: uid(), userId: currentUser.id, itemId, itemName: item.name,
    price: item.price, status: 'pending', at: new Date().toISOString()
  });
  state.notifications.push({
    id: uid(), userId: currentUser.id,
    title: 'Order placed',
    body: item.name + ' - ' + fmtINR(item.price),
    read: false, at: new Date().toISOString()
  });
  await save();
  return { ok: true };
}

async function updateOrderStatus(orderId, newStatus) {
  const order = state.orders.find(o => o.id === orderId);
  if (!order) return { ok: false };
  order.status = newStatus;
  await save();
  return { ok: true };
}

/* ============================================================
   DERIVED DATA
   ============================================================ */
function notificationsFor(userId) {
  return state.notifications.filter(n => n.userId === userId).sort((a, b) => new Date(b.at) - new Date(a.at));
}

function unreadCount(userId) {
  return state.notifications.filter(n => n.userId === userId && !n.read).length;
}

function appsFor(userId) {
  return state.applications.filter(a => a.parentId === userId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function paymentsFor(userId) {
  return state.payments.filter(p => p.parentId === userId).sort((a, b) => new Date(b.at) - new Date(a.at));
}

function ordersFor(userId) {
  return state.orders.filter(o => o.userId === userId).sort((a, b) => new Date(b.at) - new Date(a.at));
}

function totalRevenue() {
  return state.payments.filter(p => p.status === 'approved').reduce((s, p) => s + (p.amount || 0), 0);
}

function totalExpenses() {
  return state.expenses.reduce((s, e) => s + (e.amount || 0), 0);
}

function revenueByMonth() {
  const now = new Date();
  const buckets = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    buckets.push({ year: d.getFullYear(), month: d.getMonth(), total: 0, label: d.toLocaleString('en-IN', { month: 'short' }) });
  }
  state.payments.filter(p => p.status === 'approved').forEach(p => {
    const d = new Date(p.at);
    const b = buckets.find(b => b.year === d.getFullYear() && b.month === d.getMonth());
    if (b) b.total += p.amount || 0;
  });
  return buckets;
}

function leaderboard() {
  const arr = Object.entries(state.points || {}).map(([userId, pts]) => {
    const u = state.users.find(x => x.id === userId);
    return { userId, pts, name: u ? u.name : 'Unknown', role: u ? u.role : '' };
  });
  return arr.filter(x => x.role === 'parent').sort((a, b) => b.pts - a.pts).slice(0, 10);
}

/* ============================================================
   RENDER
   ============================================================ */
function app() { return document.getElementById('app'); }

function navigate(view) {
  currentView = view;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  const root = app();
  if (!root) return;
  const focused = document.activeElement;
  const isTyping = focused && ['INPUT','TEXTAREA','SELECT'].includes(focused.tagName);
  if (isTyping && root.dataset.view === currentView + ':' + (currentUser ? currentUser.id : 'guest')) return;
  root.dataset.view = currentView + ':' + (currentUser ? currentUser.id : 'guest');

  let html = '';
  if (currentUser) {
    if (currentUser.role === 'owner') html = viewOwner();
    else html = viewParent();
    if (currentUser.role === 'owner') startPolling();
    else stopPolling();
  } else {
    if (currentView === 'login') html = viewLogin();
    else if (currentView === 'register') html = viewRegister();
    else if (currentView === 'status') html = viewStatus();
    else html = viewLanding();
    stopPolling();
  }
  root.innerHTML = html + '<div id="toast" class="toast"></div>';
  attachEvents();
  if (currentView === 'apply' && currentUser) mountApplyWizard();
  if (currentUser && currentUser.role === 'parent' && document.getElementById('upi-qr')) mountUPIQR();
}

function statusPill(s) {
  const map = {
    pending_payment: ['pill--warning', 'Pending Payment'],
    payment_review: ['pill--info', 'Under Review'],
    approved: ['pill--success', 'Approved'],
    rejected: ['pill--danger', 'Rejected']
  };
  const [cls, label] = map[s] || ['pill--muted', s];
  return `<span class="pill ${cls}">${label}</span>`;
}

function orderPill(s) {
  const map = { pending: ['pill--warning', 'Pending'], ready: ['pill--info', 'Ready'], delivered: ['pill--success', 'Delivered'] };
  const [cls, label] = map[s] || ['pill--muted', s];
  return `<span class="pill ${cls}">${label}</span>`;
}

function mountUPIQR() {
  const el = document.getElementById('upi-qr');
  if (!el || typeof QRCode === 'undefined') return;
  el.innerHTML = '';
  const amount = state.settings.applicationFee;
  const upi = `upi://pay?pa=${encodeURIComponent(state.settings.upiId)}&pn=Madhi+School&am=${amount}&cu=INR&tn=Admission+Fee`;
  try { new QRCode(el, { text: upi, width: 200, height: 200 }); } catch (e) { log('qr fail', e); }
}

/* ============================================================
   APPLY WIZARD
   ============================================================ */
let applyStep = 1;
function mountApplyWizard() {
  applyStep = 1;
  updateApplyStep();
}

function updateApplyStep() {
  const form = document.getElementById('apply-form');
  if (!form) return;
  form.querySelectorAll('[data-step]').forEach(el => {
    el.style.display = parseInt(el.dataset.step) === applyStep ? '' : 'none';
  });
  document.querySelectorAll('.progress__step').forEach(el => {
    const n = parseInt(el.dataset.step);
    el.classList.toggle('progress__step--active', n === applyStep);
    el.classList.toggle('progress__step--done', n < applyStep);
  });
  const prev = form.querySelector('[data-action="apply-prev"]');
  const next = form.querySelector('[data-action="apply-next"]');
  if (prev) prev.style.display = applyStep > 1 ? '' : 'none';
  if (next) next.textContent = applyStep === 4 ? 'Confirm & Pay' : 'Continue';
  if (applyStep === 3) {
    const fd = new FormData(form);
    const rev = document.getElementById('apply-review');
    if (rev) rev.innerHTML = `
      <strong>Student:</strong> ${escapeHTML(fd.get('studentName'))}<br>
      <strong>DOB:</strong> ${escapeHTML(fd.get('dob'))}<br>
      <strong>Gender:</strong> ${escapeHTML(fd.get('gender'))}<br>
      <strong>Grade:</strong> ${escapeHTML(fd.get('grade'))}<br>
      <strong>Address:</strong> ${escapeHTML(fd.get('address'))}
    `;
  }
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachEvents() {
  // Navigation
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const view = el.dataset.nav;
      if (view === 'parent_apply') { applyStep = 1; navigate('parent_apply'); return; }
      navigate(view);
    });
  });

  // Toggle mobile menu
  const toggle = document.querySelector('[data-action="toggle-menu"]');
  if (toggle) toggle.addEventListener('click', () => {
    document.querySelector('.navbar__menu')?.classList.toggle('navbar__menu--open');
  });

  // Logout
  document.querySelectorAll('[data-action="logout"]').forEach(el => el.addEventListener('click', logout));

  // Login form
  const loginForm = document.getElementById('login-form');
  if (loginForm) loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('login-error');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    const fd = new FormData(loginForm);
    const res = await doLogin(fd.get('username'), fd.get('password'));
    btn.disabled = false; btn.textContent = 'Login';
    if (!res.ok) { err.textContent = res.error; err.style.display = ''; return; }
    err.style.display = 'none';
    toast('Welcome back, ' + res.user.name, 'success');
    navigate(res.user.role === 'owner' ? 'owner_dash' : 'parent_dash');
  });

  // Register form
  const regForm = document.getElementById('register-form');
  if (regForm) regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('register-btn');
    const err = document.getElementById('register-error');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    const fd = new FormData(regForm);
    const res = await doRegister({
      name: fd.get('name'), username: fd.get('username'),
      password: fd.get('password'), phone: fd.get('phone'), email: fd.get('email')
    });
    btn.disabled = false; btn.textContent = 'Create Account';
    if (!res.ok) { err.textContent = res.error; err.style.display = ''; return; }
    toast('Account created!', 'success');
    navigate('parent_dash');
  });

  // Status lookup
  const statusForm = document.getElementById('status-form');
  if (statusForm) statusForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(statusForm);
    const ref = String(fd.get('reference')).trim().toUpperCase();
    const app = state.applications.find(a => a.reference.toUpperCase() === ref);
    const box = document.getElementById('status-result');
    if (!app) {
      box.innerHTML = `<div class="alert alert--danger">No application found with reference <strong>${escapeHTML(ref)}</strong></div>`;
      return;
    }
    box.innerHTML = `<div class="status-result">
      <div class="status-result__head">
        <div><p class="status-result__ref">Reference</p><p class="status-result__name">${escapeHTML(app.reference)}</p></div>
        ${statusPill(app.status)}
      </div>
      <div class="detail-grid detail-grid--2">
        <div class="detail-item"><span class="detail-item__label">Student</span><span class="detail-item__value">${escapeHTML(app.studentName)}</span></div>
        <div class="detail-item"><span class="detail-item__label">Grade</span><span class="detail-item__value">${escapeHTML(app.grade)}</span></div>
        <div class="detail-item"><span class="detail-item__label">Submitted</span><span class="detail-item__value">${fmtDate(app.createdAt)}</s<div class="detail-item"><span class="detail-item__label">Grade</span><span class="detail-item__value">${escapeHTML(app.grade)}</span></div>
        <div class="detail-item"><span class="detail-item__label">Submitted</span><span class="detail-item__value">${fmtDate(app.createdAt)}</span></div>
        <div class="detail-item"><span class="detail-item__label">Parent</span><span class="detail-item__value">${escapeHTML(app.parentName)}</span></div>
      </div>
    </div>`;
  });

  // Apply wizard
  const applyForm = document.getElementById('apply-form');
  if (applyForm) {
    applyForm.querySelector('[data-action="apply-next"]')?.addEventListener('click', async () => {
      // Validate current step
      const stepEl = applyForm.querySelector(`[data-step="${applyStep}"]`);
      const inputs = stepEl.querySelectorAll('input[required],select[required],textarea[required]');
      for (const inp of inputs) {
        if (!inp.checkValidity()) { inp.reportValidity(); return; }
      }
      if (applyStep < 3) { applyStep++; updateApplyStep(); return; }
      if (applyStep === 3) { applyStep = 4; updateApplyStep(); return; }
      // Submit
      const fd = new FormData(applyForm);
      const res = await submitApplication({
        studentName: fd.get('studentName'), dob: fd.get('dob'),
        gender: fd.get('gender'), grade: fd.get('grade'),
        previousSchool: fd.get('previousSchool'), address: fd.get('address')
      });
      if (res.ok) {
        toast('Application created — pay now', 'success');
        navigate('parent_dash');
      }
    });
    applyForm.querySelector('[data-action="apply-prev"]')?.addEventListener('click', () => {
      if (applyStep > 1) { applyStep--; updateApplyStep(); }
    });
  }

  // Payments — Pay Now opens modal with UPI QR
  document.querySelectorAll('[data-action="open-pay"]').forEach(btn => btn.addEventListener('click', () => {
    const appId = btn.dataset.id;
    showPayModal(appId);
  }));

  // Refresh status
  document.querySelectorAll('[data-action="refresh-status"]').forEach(btn => btn.addEventListener('click', async () => {
    await bootPull();
    render();
    toast('Status refreshed', 'success');
  }));

  // Approve / reject apps
  document.querySelectorAll('[data-action="approve-app"]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('Approve this application?')) return;
    const res = await approveApp(btn.dataset.id);
    if (res.ok) { toast('Application approved', 'success'); render(); }
  }));
  document.querySelectorAll('[data-action="reject-app"]').forEach(btn => btn.addEventListener('click', async () => {
    const reason = prompt('Reason for rejection:') || '';
    if (reason === null) return;
    const res = await rejectApp(btn.dataset.id, reason);
    if (res.ok) { toast('Application rejected', 'warning'); render(); }
  }));

  // Search apps
  const search = document.getElementById('app-search');
  if (search) search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    document.querySelectorAll('#apps-table-wrap tbody tr').forEach(row => {
      row.style.display = !q || (row.dataset.search || '').includes(q) ? '' : 'none';
    });
  });

  // Store orders
  document.querySelectorAll('[data-action="order"]').forEach(btn => btn.addEventListener('click', async () => {
    const res = await placeOrder(btn.dataset.id);
    if (res.ok) { toast('Order placed!', 'success'); render(); }
  }));
  document.querySelectorAll('[data-action="order-ready"]').forEach(btn => btn.addEventListener('click', async () => {
    await updateOrderStatus(btn.dataset.id, 'ready'); toast('Marked ready', 'success'); render();
  }));
  document.querySelectorAll('[data-action="order-delivered"]').forEach(btn => btn.addEventListener('click', async () => {
    await updateOrderStatus(btn.dataset.id, 'delivered'); toast('Marked delivered', 'success'); render();
  }));

  // Broadcast
  const bForm = document.getElementById('broadcast-form');
  if (bForm) bForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(bForm);
    const title = fd.get('title').trim();
    const body = fd.get('body').trim();
    state.announcements.push({ id: uid(), title, body, at: new Date().toISOString() });
    state.users.filter(u => u.role === 'parent').forEach(u => {
      state.notifications.push({ id: uid(), userId: u.id, title: '📢 ' + title, body, read: false, at: new Date().toISOString() });
    });
    await save();
    toast('Announcement sent to all parents', 'success');
    render();
  });

  // Expense form
  const eForm = document.getElementById('expense-form');
  if (eForm) eForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(eForm);
    state.expenses.push({
      id: uid(), category: fd.get('category'), amount: Number(fd.get('amount')),
      note: fd.get('note'), at: new Date().toISOString()
    });
    await save();
    toast('Expense added', 'success');
    render();
  });

  // Export backup
  document.querySelectorAll('[data-action="export-backup"]').forEach(btn => btn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'madhi-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(url);
    toast('Backup exported', 'success');
  }));

  // Notifications
  document.querySelectorAll('[data-action="mark-read"]').forEach(btn => btn.addEventListener('click', async () => {
    const n = state.notifications.find(x => x.id === btn.dataset.id);
    if (n) { n.read = true; await save(); render(); }
  }));
  document.querySelectorAll('[data-action="mark-all-read"]').forEach(btn => btn.addEventListener('click', async () => {
    state.notifications.forEach(n => { if (n.userId === currentUser.id) n.read = true; });
    await save(); render();
  }));

  // Avatar upload
  const avatarInput = document.getElementById('avatar-input');
  if (avatarInput) avatarInput.addEventListener('change', () => {
    const file = avatarInput.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) { toast('Max 500KB', 'error'); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      currentUser.avatar = reader.result;
      const u = state.users.find(x => x.id === currentUser.id);
      if (u) u.avatar = reader.result;
      await save();
      toast('Photo updated', 'success');
      render();
    };
    reader.readAsDataURL(file);
  });

  // View app detail
  document.querySelectorAll('[data-action="view-app"]').forEach(btn => btn.addEventListener('click', () => {
    const a = state.applications.find(x => x.id === btn.dataset.id);
    if (!a) return;
    alert(
      'Reference: ' + a.reference + '\n' +
      'Student: ' + a.studentName + '\n' +
      'Grade: ' + a.grade + '\n' +
      'Status: ' + a.status + '\n' +
      'Submitted: ' + fmtDateTime(a.createdAt)
    );
  }));
}

/* ============================================================
   PAY MODAL
   ============================================================ */
function showPayModal(appId) {
  const fee = state.settings.applicationFee;
  const upi = state.settings.upiId;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(11,45,92,.55);display:grid;place-items:center;z-index:9999;padding:16px';
  overlay.innerHTML = `
    <div class="card" style="max-width:420px;width:100%;position:relative">
      <button style="position:absolute;top:12px;right:12px;border:none;background:transparent;font-size:22px;cursor:pointer" data-close>✕</button>
      <h3 class="card__title">Pay Application Fee</h3>
      <p class="card__subtitle">Scan the QR or use UPI ID</p>
      <div style="display:grid;place-items:center;padding:16px;background:#F8FAFC;border-radius:12px;margin-bottom:16px">
        <div id="upi-qr"></div>
      </div>
      <div class="detail-item mb-4">
        <span class="detail-item__label">UPI ID</span>
        <span class="detail-item__value">${escapeHTML(upi)}</span>
      </div>
      <div class="detail-item mb-4">
        <span class="detail-item__label">Amount</span>
        <span class="detail-item__value">${fmtINR(fee)}</span>
      </div>
      <div class="flex gap-2" style="flex-wrap:wrap">
        <a class="btn btn--primary" href="upi://pay?pa=${encodeURIComponent(upi)}&pn=Madhi+School&am=${fee}&cu=INR&tn=Admission+Fee">Pay via UPI App</a>
        <button class="btn btn--outline" data-copy>Copy UPI ID</button>
        <button class="btn btn--navy btn--block" data-paid style="margin-top:8px">I Have Paid</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  setTimeout(() => {
    const el = overlay.querySelector('#upi-qr');
    if (el && typeof QRCode !== 'undefined') {
      try { new QRCode(el, { text: `upi://pay?pa=${encodeURIComponent(upi)}&pn=Madhi+School&am=${fee}&cu=INR&tn=Admission+Fee`, width: 200, height: 200 }); } catch (e) {}
    }
  }, 100);

  overlay.querySelector('[data-close]').addEventListener('click', () => overlay.remove());
  overlay.querySelector('[data-copy]').addEventListener('click', () => {
    navigator.clipboard.writeText(upi).then(() => toast('UPI ID copied', 'success'));
  });
  overlay.querySelector('[data-paid]').addEventListener('click', async () => {
    const res = await markPaid(appId);
    overlay.remove();
    if (res.ok) { toast('Payment sent for review', 'success'); render(); }
    else toast('Failed: ' + (res.error||''), 'error');
  });
}

/* ============================================================
   PWA
   ============================================================ */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;background:#0B2D5C;color:#fff;padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:9000;box-shadow:0 12px 32px rgba(0,0,0,.25)';
  banner.innerHTML = `<span>Install Madhi app for quick access</span>
    <span class="flex gap-2"><button class="btn btn--accent btn--sm" data-install>Install</button>
    <button class="btn btn--ghost btn--sm" data-dismiss>Later</button></span>`;
  document.body.appendChild(banner);
  banner.querySelector('[data-install]').addEventListener('click', async () => {
    banner.remove();
    if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
  });
  banner.querySelector('[data-dismiss]').addEventListener('click', () => banner.remove());
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => log('sw register fail', e));
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  await bootPull();
  await ensureOwner();
  restoreSession();
  if (currentUser) {
    if (currentUser.role === 'owner') navigate('owner_dash');
    else navigate('parent_dash');
  } else {
    navigate('landing');
  }
})();
</script>
</body>
